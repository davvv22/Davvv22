<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page — Davvv Ganteng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgMusic" autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung audio.
    </audio>

    <header class="header">
        <h1 class="title">Payment Page — Davvv Ganteng</h1>
    </header>

    <main class="payment-container">
        <div class="payment-card" data-method="dana">
            <div class="logo-placeholder">DANA</div>
            <div class="qr-placeholder"></div>
            <p class="account-number">089616048908</p>
            <button class="copy-btn">Salin Nomor</button>
            <span class="copied-tooltip">Copied!</span>
        </div>

        <div class="payment-card" data-method="gopay">
            <div class="logo-placeholder">GoPay</div>
            <div class="qr-placeholder"></div>
            <p class="account-number">089616048908</p>
            <button class="copy-btn">Salin Nomor</button>
            <span class="copied-tooltip">Copied!</span>
        </div>

        <div class="payment-card" data-method="ovo">
            <div class="logo-placeholder">OVO</div>
            <div class="qr-placeholder"></div>
            <p class="account-number">082310169042</p>
            <button class="copy-btn">Salin Nomor</button>
            <span class="copied-tooltip">Copied!</span>
        </div>
    </main>

    <footer class="footer">
        <button id="changeBgBtn" class="change-bg-btn">Ganti Latar</button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
